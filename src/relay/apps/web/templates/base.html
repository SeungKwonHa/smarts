<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RELAY Ops — {% block title %}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    nav { background: #1e293b; border-bottom: 1px solid #334155;
          padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 2rem; }
    nav .logo { font-weight: 700; font-size: 1.1rem; color: #38bdf8;
                letter-spacing: 0.05em; }
    nav a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; }
    nav a:hover, nav a.active { color: #e2e8f0; }
    nav .badge { background: #ef4444; color: white; border-radius: 9999px;
                 padding: 0.1rem 0.45rem; font-size: 0.7rem; margin-left: 0.3rem; }
    .dry-run-banner { background: #854d0e; color: #fef08a; text-align: center;
                      padding: 0.4rem; font-size: 0.8rem; font-weight: 600; }
    main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.25rem; color: #f1f5f9; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: #cbd5e1; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem;
            padding: 1.25rem; }
    .grid { display: grid; gap: 1rem; }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .stat { }
    .stat .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase;
                   letter-spacing: 0.05em; }
    .stat .value { font-size: 1.75rem; font-weight: 700; color: #f1f5f9; margin-top: 0.25rem; }
    .stat .value.alert { color: #ef4444; }
    .stat .value.ok { color: #22c55e; }
    .tag { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 0.25rem;
           font-size: 0.7rem; font-weight: 600; }
    .tag-blue { background: #1e40af; color: #bfdbfe; }
    .tag-green { background: #166534; color: #bbf7d0; }
    .tag-yellow { background: #854d0e; color: #fef08a; }
    .tag-red { background: #7f1d1d; color: #fecaca; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.5rem 0.75rem; color: #64748b;
         font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #334155; }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid #1e293b; vertical-align: top; }
    tr:hover td { background: #1e293b; }
    .btn { display: inline-block; padding: 0.4rem 0.9rem; border-radius: 0.375rem;
           font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none;
           text-decoration: none; }
    .btn-green { background: #16a34a; color: white; }
    .btn-green:hover { background: #15803d; }
    .btn-red { background: #dc2626; color: white; }
    .btn-red:hover { background: #b91c1c; }
    .btn-gray { background: #374151; color: #d1d5db; }
    .btn-gray:hover { background: #4b5563; }
    .summary { font-size: 0.85rem; color: #94a3b8; max-width: 600px; }
    pre { font-size: 0.75rem; background: #0f172a; padding: 0.75rem;
          border-radius: 0.375rem; overflow-x: auto; color: #94a3b8; }
    .section-gap { margin-top: 1.5rem; }
  </style>
</head>
<body>
  {% if dry_run %}
  <div class="dry-run-banner">DRY RUN MODE — no real external writes</div>
  {% endif %}
  <nav>
    <span class="logo">RELAY</span>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
    <a href="/approvals" {% if request.url.path == "/approvals" %}class="active"{% endif %}>
      Approvals
      {% if pending_approvals is defined and pending_approvals > 0 %}
      <span class="badge">{{ pending_approvals }}</span>
      {% endif %}
    </a>
    <a href="/workflow" {% if request.url.path == "/workflow" %}class="active"{% endif %}>Workflow</a>
    <a href="/events" {% if request.url.path == "/events" %}class="active"{% endif %}>Live Events</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
