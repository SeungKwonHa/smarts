[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
description = "Zero-inventory agent-operated cross-border commerce system"
requires-python = ">=3.12"
dependencies = [
    # Core async / HTTP
    "httpx>=0.27",
    "asyncio-throttle>=1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",   # for alembic sync ops
    # Redis
    "redis>=5.0",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LLM
    "openai>=1.40",            # used as LongCat gateway client
    # Web / UI
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Scheduling
    "apscheduler>=3.10",
    # Scraping (Playwright registered separately: playwright install chromium)
    "playwright>=1.45",
    # Image processing
    "Pillow>=10.3",
    "imagehash>=4.3",
    # Observability
    "structlog>=24.2",
    "langfuse>=2.0",
    # Utilities
    "uuid6>=2022.10.25",       # uuid7 generation
    "httpx[http2]>=0.27",
    "tenacity>=8.3",
    "python-jose[cryptography]>=3.3",  # PII encryption helpers
    "bcrypt>=4.1",                     # Naver Commerce API signing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
]

[project.scripts]
relay-scheduler   = "relay.scheduler:main"
relay-intelligence = "relay.intelligence:main"
relay-listing      = "relay.listing:main"
relay-operations   = "relay.operations:main"
relay-cs           = "relay.cs:main"
relay-analytics    = "relay.analytics:main"
relay-web          = "relay.apps.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "llm_eval: LLM evaluation suite (run manually before template changes)",
    "live: live integration tests against real APIs (requires flag RELAY_LIVE=1)",
]
